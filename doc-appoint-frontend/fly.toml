app = 'doc-appoint-frontend'
primary_region = 'bom'

[build]
  dockerfile = "Dockerfile"
[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
